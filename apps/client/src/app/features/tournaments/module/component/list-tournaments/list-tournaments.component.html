<ion-header>
  <ion-toolbar>
    <ion-title>Lista de torneos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (tournament of tournaments; track tournament.id) {
      <ion-item>
        <ion-label>
          {{ tournament.name }} - {{ tournament.sport }}
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
